<div id="result" class="content-grid full-width hidden" tabindex="-1">
  <div class="wrapper">
    <div class="stats">
      <!-- <div class="info">words 10<br>punctuation</div> -->

      <div class="group wpm">
        <div class="top" aria-label="Tezlik (WPM)&#10;Bir daqiqada o'rtacha nechta so'z yozganingizni ko'rsatadi." data-balloon-pos="down" data-balloon-length="large" data-balloon-break>
          <div class="text">Tezlik</div>
          <div
            class="crown hidden"
            aria-label=""
            data-balloon-pos="down"
            data-balloon-length="medium"
          >
            <i class="fas fa-question"></i>
            <i class="fas fa-crown"></i>
            <i class="fas fa-slash"></i>
            <i class="fas fa-exclamation-triangle"></i>
          </div>
        </div>
        <div class="bottom" aria-label="" data-balloon-pos="down" data-balloon-length="large" data-balloon-break>-</div>
      </div>
      <div class="group acc">
        <div class="top" aria-label="Aniqlik&#10;Yozgan belgilaringizning necha foizi to'g'ri ekanini ko'rsatadi." data-balloon-pos="down" data-balloon-length="large" data-balloon-break>Aniqlik</div>
        <div class="bottom" aria-label="" data-balloon-pos="down" data-balloon-length="large" data-balloon-break>-</div>
      </div>
    </div>
    <div class="stats morestats">
      <div class="group testType">
        <div class="top">Test turi</div>
        <div class="bottom">-</div>
        <div class="tags hidden" style="margin-top: 0.5rem">
          <div class="top">
            <span>tags</span>
            <div
              class="textButton editTagsButton"
              result-id=""
              active-tag-ids=""
              aria-label="Edit tags"
              role="button"
              data-balloon-pos="right"
            >
              <i class="fas fa-pen fa-fw"></i>
            </div>
          </div>
          <div class="bottom">-</div>
        </div>
      </div>
      <!-- <div class="group infoAndTags"> -->
      <div class="group info">
        <div class="top">Boshqa</div>
        <div class="bottom">-</div>
      </div>

      <!-- </div> -->
      <!-- <div class="subgroup"> -->
      <div class="group raw">
        <div class="top" aria-label="Xom tezlik&#10;Xatolar hisobga olinmasdan hisoblangan yozish tezligi." data-balloon-pos="up" data-balloon-length="large" data-balloon-break>Xom tezlik</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>
      <div class="group key">
        <div class="top" aria-label="Belgilar&#10;Yozish natijangizdagi belgilar statistikasi." data-balloon-pos="up" data-balloon-length="large" data-balloon-break>Belgilar</div>
        <div
          class="bottom"
          aria-label="to'g'ri&NewLine;xato&NewLine;ortiqcha&NewLine;o'tkazib yuborilgan"
          data-balloon-break=""
          data-balloon-pos="up"
        >
          -
        </div>
      </div>

      <!-- </div> -->

      <!-- <div class="subgroup"> -->
      <div class="group flat consistency">
        <div class="top" aria-label="Barqarorlik&#10;Test davomida yozish tezligingiz qanchalik bir xil bo'lganini ko'rsatadi." data-balloon-pos="up" data-balloon-length="large" data-balloon-break>Barqarorlik</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">2 -</div>
      </div>
      <div class="group time">
        <div class="top" aria-label="Vaqt&#10;Test qancha vaqt davom etganligini ko'rsatadi." data-balloon-pos="up" data-balloon-length="large" data-balloon-break>Vaqt</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">
          <div class="text">-</div>
          <div class="afk"></div>
          <div class="timeToday"></div>
        </div>
      </div>
      <!-- </div> -->

      <div class="group dailyLeaderboard hidden">
        <div class="top">Kunlik reyting</div>
        <div
          id="dailyLeaderboardRank"
          aria-label="Kunlik reytingni ko'rsatish"
          data-balloon-pos="up"
          class="bottom"
        >
          -
        </div>
      </div>

      <div class="group source hidden">
        <div class="top">
          <span style="margin-right: 0.5em">Manba</span>
          <span
            id="reportQuoteButton"
            class="textButton hidden"
            aria-label="Report quote"
            data-balloon-pos="up"
          >
            <i class="icon fas fa-fw fa-flag"></i>
          </span>
          <span
            id="favoriteQuoteButton"
            class="textButton hidden"
            aria-label="Favorite quote"
            data-balloon-pos="up"
          >
            <i class="icon far fa-fw fa-heart"></i>
          </span>
          <span
            id="rateQuoteButton"
            class="textButton hidden"
            aria-label="Rate quote"
            data-balloon-pos="up"
          >
            <i class="icon far fa-fw fa-star"></i>
            <span class="rating"></span>
          </span>
        </div>
        <div class="bottom">-</div>
      </div>
    </div>
    <div class="chart">
      <div class="chartLegend">
        <button class="text active" tabindex="-1" data-id="scale">
          <i class="fas fa-chart-line"></i>
          <div class="text">scale</div>
        </button>
        <button class="text" tabindex="-1" data-id="pbLine">
          <i class="fas fa-crown"></i>
          <div class="text">pb</div>
        </button>
        <button class="text" tabindex="-1" data-id="tagPbLine">
          <i class="fas fa-tag"></i>
          <div class="text">tag pb</div>
        </button>
        <button class="text" tabindex="-1" data-id="raw">
          <div class="line dashed"></div>
          <div class="text">raw</div>
        </button>
        <button class="text" tabindex="-1" data-id="burst">
          <div class="line"></div>
          <div class="text">burst</div>
        </button>
        <button class="text" tabindex="-1" data-id="errors">
          <!-- <div class="line"></div> -->
          <i class="fas fa-times"></i>
          <div class="text">errors</div>
        </button>
      </div>
      <!-- <div class="title">wpm over time</div> -->
      <canvas id="wpmChart"></canvas>
    </div>
    <div class="bottom">
      <div id="resultWordsHistory" class="hidden">
        <div class="title">
          <span>input history</span>
          <button
            id="copyWordsListButton"
            class="textButton"
            aria-label="Copy words list"
            data-balloon-pos="up"
            style="display: inline-block"
            tabindex="-1"
          >
            <i class="fas fa-fw fa-align-left"></i>
          </button>
          <button
            id="copyMissedWordsListButton"
            class="textButton"
            aria-label="Copy missed words list"
            data-balloon-pos="up"
            tabindex="-1"
          >
            <i class="fas fa-fw fa-times"></i>
          </button>
          <button
            id="toggleBurstHeatmap"
            class="textButton"
            aria-label="Toggle burst heatmap"
            data-balloon-pos="up"
            style="display: inline-block"
            tabindex="-1"
          >
            <i class="fas fa-fw fa-fire-alt"></i>
          </button>
          <div class="heatmapLegend hidden">
            <div class="boxes">
              <div class="box box0"></div>
              <div class="box box1"></div>
              <div class="box box2"></div>
              <div class="box box3"></div>
              <div class="box box4"></div>
            </div>
          </div>
        </div>
        <div class="words"></div>
      </div>
      <div id="resultReplay" class="hidden">
        <div class="title">
          watch replay
          <button
            id="playpauseReplayButton"
            class="textButton"
            aria-label="Start replay"
            data-balloon-pos="up"
            style="display: inline-block"
            tabindex="-1"
          >
            <i class="fas fa-play"></i>
          </button>
          <p id="replayStats">0s</p>
        </div>
        <div id="replayWordsWrapper">
          <div id="replayWords" class="words"></div>
        </div>
      </div>
      <button id="retrySavingResultButton" class="danger hidden">
        <i class="fas fa-redo"></i>
        Retry saving result
      </button>
      <div class="buttons">
        <button
          class="text"
          id="nextTestButton"
          aria-label="Keyingi test"
          role="button"
          data-balloon-pos="down"
        >
          <i class="fas fa-fw fa-chevron-right"></i>
        </button>
        <button
          class="text"
          id="restartTestButtonWithSameWordset"
          aria-label="Testni qaytarish"
          role="button"
          data-balloon-pos="down"
        >
          <i class="fas fa-fw fa-sync-alt"></i>
        </button>
        <button
          class="text"
          id="practiseWordsButton"
          aria-label="So'zlarni mashq qilish"
          role="button"
          data-balloon-pos="down"
        >
          <i class="fas fa-fw fa-exclamation-triangle"></i>
        </button>
        <button
          class="text"
          id="showWordHistoryButton"
          aria-label="So'zlar tarixini ko'rsatish"
          role="button"
          data-balloon-pos="down"
        >
          <i class="fas fa-fw fa-align-left"></i>
        </button>
        <button
          class="text"
          id="watchReplayButton"
          aria-label="Qaytadan ko'rish"
          role="button"
          data-balloon-pos="down"
        >
          <i class="fas fa-fw fa-backward"></i>
        </button>
        <button
          class="text"
          id="saveScreenshotButton"
          aria-label="Skrinshotni nusxalash&#10;(yuklab olish uchun shift+click)"
          role="button"
          data-balloon-pos="down"
          data-balloon-break
        >
          <i class="far fa-fw fa-image"></i>
        </button>
        <!-- <button
          class="text"
          id="watchVideoAdButton"
          aria-label="Watch video ad"
          role="button"
          data-balloon-pos="down"
        >
          <i class="fas fa-fw fa-ad"></i>
        </button> -->
      </div>
      <mount data-component="ad-result"></mount>
    </div>
    <div class="loginTip">
      <a href="/login" router-link>Kirish</a>
      orqali natijangizni saqlang
    </div>
    <div class="ssWatermark hidden">typex.uz</div>
  </div>
</div>
