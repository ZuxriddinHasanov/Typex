<div class="page pageTest full-width content-grid hidden" data-nosnippet>
  <mount data-component="testconfig" class="full-width"></mount>
  <mount
    data-component="livestatsbar"
    class="full-width flex justify-center pb-2"
  ></mount>

  <!-- REKLAMA JOYI (Admin panel orqali yoqiladi/o'chiriladi) -->
  <div
    id="ad-placeholder-top"
    class="full-width content-grid hidden transition-all duration-300"
  >
    <div
      class="ad-container bg-sub-alt/20 rounded-xl flex items-center justify-center p-4 border border-sub/10 min-h-[90px] mb-4"
    >
      <span class="text-sub/50 text-sm font-medium">
        <i class="fas fa-ad mr-2"></i>
        Reklama joyi
      </span>
    </div>
  </div>

  <div id="testInitFailed" class="content-grid hidden">
    <div class="message">
      <div class="text">
        Test initialization failed. Please try different settings or refreshing
        the page. If the problem persists, please contact support.
      </div>
      <div class="error"></div>
      <button class="active restart">
        <i class="fas fa-fw fa-redo-alt"></i>
        Restart
      </button>
    </div>
  </div>
  <div id="typingTest" class="content-grid full-width-padding">
    <div id="capsWarning" class="hidden">
      <i class="fas fa-lock"></i>
      Caps Lock
    </div>
    <div id="liveStatsTextTop" class="timerMain">
      <div class="wrapper">
        <div
          class="timerProgress transition-opacity duration-125"
          style="opacity: 0"
        >
          1:00
        </div>
      </div>
    </div>
    <div id="liveStatsMini" class="full-width timerMain">
      <div class="time transition-opacity duration-125" style="opacity: 0">
        1:00
      </div>
      <div class="speed transition-opacity duration-125" style="opacity: 0">
        60
      </div>
      <div class="acc transition-opacity duration-125" style="opacity: 0">
        100%
      </div>
      <div class="burst transition-opacity duration-125" style="opacity: 0">
        1
      </div>
    </div>
    <div id="wordsWrapper" class="content-grid full-width" translate="no">
      <textarea
        id="wordsInput"
        class="full-width"
        autocomplete="off"
        autocapitalize="off"
        autocapitalize="none"
        autocorrect="off"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        data-bwignore
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        list="autocompleteOff"
        spellcheck="false"
      ></textarea>
      <div class="outOfFocusWarning hidden">
        <div>
          <i class="fas fa-fw fa-mouse-pointer"></i>
        </div>
        <div class="text">Click here or press any key to focus</div>
      </div>
      <div id="paceCaret" class="full-width default hidden"></div>
      <div id="caret" class="full-width default"></div>
      <div id="words"></div>
    </div>

    <div id="compositionDisplay"></div>
    <button
      id="restartTestButton"
      aria-label="Restart Test"
      data-balloon-pos="down"
      class="text"
    >
      <i class="fas fa-fw fa-redo-alt"></i>
    </button>
    <div id="liveStatsTextBottom" class="timerMain">
      <div class="wrapper">
        <div
          class="liveSpeed transition-opacity duration-125"
          style="opacity: 0"
        >
          123
        </div>
        <div class="liveAcc transition-opacity duration-125" style="opacity: 0">
          100%%
        </div>
        <div
          class="liveBurst transition-opacity duration-125"
          style="opacity: 0"
        >
          1
        </div>
      </div>
    </div>
  </div>
  <div class="loading hidden">
    <i class="fas fa-circle-notch fa-spin"></i>
  </div>
  <load src="./test-result.html" />
</div>
